name: Build Turnip Magisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: android-ndk-r28
      CCACHE_DIR: /home/runner/.cache/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || \
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get build-dep mesa -y
          sudo apt-get install -y ccache ninja-build patchelf unzip curl \
            flex bison zip python3-pip python3-mako python3-yaml python3-ply \
            glslang-tools build-essential
          pip install --break-system-packages meson>=1.4.0

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: build/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mesa-${{ github.run_id }}
          restore-keys: ccache-mesa-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      - name: Build module
        id: build
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-magisk-build
          path: out/*

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/meson_log.txt
            build/ninja_log.txt
