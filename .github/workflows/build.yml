name: Build Turnip Magisk Module

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || \
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get build-dep mesa -y
          sudo apt-get install -y ccache ninja-build patchelf unzip curl \
            flex bison zip python3-pip python3-mako python3-yaml python3-ply \
            glslang-tools build-essential
          pip install --break-system-packages meson>=1.4.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: mesa-turnip-${{ github.sha }}
          restore-keys: mesa-turnip-

      - name: Build module
        id: build
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-magisk-build
          path: out/*

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/meson_log.txt
            build/ninja_log.txt

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAGISK_ZIP="${{ steps.build.outputs.magisk_zip }}"
          ADPKG_ZIP="${{ steps.build.outputs.adpkg_zip }}"
          MESA_VER="${{ steps.build.outputs.mesa_version }}"
          TAG="nightly"

          # Delete existing nightly release if it exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "Nightly — Turnip Magisk v${MESA_VER}" \
            --prerelease \
            --notes "$(cat <<EOF
          ## Turnip Magisk — Nightly Build

          **Mesa version:** ${MESA_VER}
          **Built:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Vulkan:** 1.4 (enabled for all Adreno 6xx+) with beta extensions
          **A8xx:** Supported via Whitebelyash KGSL patch
          **Unsupported GPUs:** A710/A720 added via K11MCH1 patch
          **Target:** Android 13+ (API 33)

          ### Downloads
          | File | Usage |
          |------|-------|
          | \`${MAGISK_ZIP}\` | Flash in Magisk / KernelSU / APatch |
          | \`${ADPKG_ZIP}\` | Load in emulators (Yuzu, Vita3K, Eden) or Winlator |

          ### Patches applied
          - \`enable-vk14-a6xx.patch\` — Vulkan 1.4 for A6xx (removes chip >= 7 gate)
          - \`unsup-gpus-a710-a720.patch\` — Adds Adreno 710/720 GPU definitions
          - \`a8xx-kgsl.patch\` — Whitebelyash A8xx UBWC/KGSL support

          ### Build config
          - NDK r28 | API 33 | LTO | stripped | vulkan-beta
          - Tap **action button** in Magisk to toggle: Turnip ↔ Adreno (stock)

          *This release is updated automatically. Previous builds are replaced.*
          EOF
          )" \
            "out/$MAGISK_ZIP" \
            "out/$ADPKG_ZIP"
